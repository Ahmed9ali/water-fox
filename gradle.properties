# Project-wide Gradle settings.
# For more details see:
# http://www.gradle.org/docs/current/userguide/build_environment.html

android.useAndroidX=true
# Anvil requires legacy AGP DSL classes (remove this when Anvil is removed)
android.newDsl=false
android.uniquePackageNames=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# JVM memory: sized to fit inside a Codespace without the OOM killer
org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process

org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.configuration-cache=true
org.gradle.tooling.parallel=true

com.squareup.anvil.trackSourceFiles=true

# DI framework: AnvilDagger or Metro (default)
ddg.di=Metro

# applies KSP to unit tests
ksp.allow.all.target.configuration=true

# R8 settings
# https://developer.android.com/topic/performance/app-optimization/full-mode
android.enableR8.fullMode=false
android.r8.optimizedResourceShrinking=false

# Hide the deprecation warnings from the log (optional)
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL